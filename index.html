<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>实时体育比分 · 集锦中心</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <!-- 顶部导航 -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <i class="fas fa-bolt"></i>
                <span>Sport<span class="highlight">Hub</span></span>
            </div>
            <div class="header-status">
                <span class="live-dot"></span>
                <span id="lastUpdate">实时更新中</span>
                <span class="divider">|</span>
                <span id="updateCountdown">60s</span>
            </div>
            <div class="header-actions">
                <button id="refreshBtn" class="btn-refresh" title="手动刷新">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 筛选栏 -->
    <section class="filter-bar">
        <div class="filter-container">
            <button class="filter-btn active" data-sport="all">
                <i class="fas fa-globe"></i> 全部
            </button>
            <button class="filter-btn" data-sport="football">
                <i class="fas fa-futbol"></i> 足球
            </button>
            <button class="filter-btn" data-sport="basketball">
                <i class="fas fa-basketball-ball"></i> 篮球
            </button>
            <button class="filter-btn" data-sport="rugby">
                <i class="fas fa-football"></i> 橄榄球
            </button>
            <button class="filter-btn" data-sport="badminton">
                <i class="fas fa-shuttlecock"></i> 羽毛球
            </button>
            <button class="filter-btn" data-sport="other">
                <i class="fas fa-ellipsis-h"></i> 其他
            </button>
        </div>
    </section>

    <!-- 主内容 -->
    <main class="main-content">
        <div class="container">
            <div id="matchesGrid" class="matches-grid">
                <!-- 由 JS 动态渲染 -->
            </div>
            <div id="loadingState" class="loading-state">
                <div class="spinner"></div>
                <p>正在加载赛事数据...</p>
            </div>
            <div id="errorState" class="error-state" style="display:none;">
                <i class="fas fa-exclamation-triangle"></i>
                <p id="errorMessage">获取数据失败，请稍后重试</p>
                <button id="retryBtn" class="btn-retry">重新加载</button>
            </div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <i class="fas fa-tv"></i>
                <p>暂无匹配的赛事</p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                <i class="fas fa-video"></i>
                数据来源 · RapidAPI 足球集锦 &nbsp;|&nbsp;
                自动刷新间隔 60 秒
            </p>
            <p class="footer-sub">© 2026 SportHub · 仅供个人学习使用</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
